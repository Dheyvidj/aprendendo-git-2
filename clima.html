<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Clima</title>
  </head>
  <body>
    <h1 id="local"></h1>
    <p id="clima"></p>
    <button id="botao_clima">Mostrar clima</button>
    
    <script>
        let nomeCidade = "Lucas do Rio Verde";
        let latitude = 0;
        let longitude = 0;

        async function carregarClima() {

            const responseGeo = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${nomeCidade}`)
            // const responseGeo = await fetch("https://geocoding-api.open-meteo.com/v1/search?name="+ nomeCidade)

            const dataGeo = await responseGeo.json();

            latitude = dataGeo.results[0].latitude;
            longitude = dataGeo.results[0].longitude;

            console.log(`Latitude: ${latitude} Longitude: ${longitude}`)

            const responseClima = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true`)
            
            const dataClima = await responseClima.json();

            console.log(dataClima)

            const temperatura = dataClima.current_weather.temperature;
            const vento = dataClima.current_weather.windspeed;

            console.log(`Temperatura: ${temperatura}  Vento: ${vento}`)
            
            document.getElementById("local").innerText = nomeCidade
            document.getElementById("clima").innerText = `Temperatura: ${temperatura} | Vento:${vento}`
        }

        carregarClima();

        
        
        // const botao = document.getElementById("botao_clima")
        // document.addEventListener('click', async function(env){
        //     await carregarClima();
        //     document.getElementById("local").innerText = nomeCidade
        // })

    </script>
  </body>
</html>
